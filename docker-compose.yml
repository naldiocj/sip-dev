services:
  postgres:
    image: postgres:17-alpine
    container_name: sip-postgres
    environment:
      POSTGRES_USER: sip
      POSTGRES_PASSWORD: sip_dev_password
      POSTGRES_DB: sip_development
    ports:
      - "5432:5432"
    volumes:
      - sip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sip -d sip_development"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      DATABASE_URL: postgres://sip:${SIP_DB_PASSWORD:-sip_dev_password}@postgres:5432/sip_development
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      FORCE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sip_postgres_data:
